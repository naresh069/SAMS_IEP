services:
  - type: web
    name: sams-iep-backend-naresh069
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./sams-backend/Dockerfile
    dockerContext: ./sams-backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sams-iep-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: sams-iep-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sams-iep-db
          property: password
      - key: DB_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: DB_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: DISABLE_SECURITY
        value: false
      - key: ALLOWED_ORIGINS
        value: https://naresh069.github.io,http://localhost:5173,http://127.0.0.1:5173
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000

databases:
  - name: sams-iep-db
    plan: free
    region: singapore
    databaseName: sams_iep
    user: sams_iep
