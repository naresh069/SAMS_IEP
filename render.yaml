services:
  - type: web
    name: sams-iep-backend-naresh069
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./sams-backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sams-iep-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: sams-iep-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sams-iep-db
          property: password
      - key: DB_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: DB_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: DISABLE_SECURITY
        value: false
      - key: ALLOWED_ORIGINS
        value: https://*.onrender.com,https://naresh069.github.io,http://localhost:5173,http://127.0.0.1:5173
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000

  - type: web
    name: sams-iep-frontend-naresh069
    runtime: static
    buildCommand: cd sams-frontend && npm ci && npm run build
    staticPublishPath: ./sams-frontend/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://sams-iep-backend-naresh069.onrender.com/api
      - key: VITE_USE_MOCK
        value: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: sams-iep-db
    plan: free
    region: singapore
    databaseName: sams_iep
    user: sams_iep
